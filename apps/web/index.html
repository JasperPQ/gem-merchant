<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e0c13" />
    <!-- 白天 / 夜间画面：样式生效前先定下来，打开页面时不会先闪一下深色（见 src/theme.tsx） -->
    <script>try { if (localStorage.getItem("gm-pixel-theme") === "day") document.documentElement.dataset.theme = "day"; } catch (e) {}</script>
    <meta name="description" content="创建或加入一场简洁的宝石商人对局。" />
    <title>宝石商人 · 在线对战</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- 右下角「写评价」悬浮窗，由大厅提供（game-center/public/gc-feedback.js）；牌桌和教程带 data-gc-table，那里不显示。
         本地开发（网址带端口）时没有大厅，不加载。 -->
    <script>if (!location.port) { var gcfb = document.createElement("script"); gcfb.src = "/gc-feedback.js"; gcfb.defer = true; document.body.appendChild(gcfb); }</script>
  </body>
</html>
